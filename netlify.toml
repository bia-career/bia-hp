# ハッシュタグ（#hashtag）ホームページ。ビルドはしない（HTML をそのまま公開する）
[build]
  publish = "."
  command = ""

# 仮の公開の間は、すべてのページを検索に出さない
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# 個人情報の取り扱いは、今のサイトと同じ /privacy で開く
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/privacy/"
  to = "/privacy.html"
  status = 200

# 中の資料（docs/ と README.md）はサイトから開けないようにする（GitHub には残す）
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

# 2026-11 のサイトの組み替え：ハッシュタグのページは /hashtag/ の下へ。古い URL は 301 で新しい URL へ
# （?from= などのクエリは Netlify がそのまま新しい URL に付けて渡す）。トップの / は会社のトップなので転送しない

[[redirects]]
  from = "/about.html"
  to = "/hashtag/about.html"
  status = 301
  force = true


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 129" width="200" height="129" class="f01" role="img" aria-label="電話をしながら考えている人の上に、# の吹き出しが出るイラスト">
<!-- STEP 01「# を見つける」。動きは中の CSS。親（またはこの svg）に .is-playing が付いている間だけ動く。付いていないときは止まった 1 枚の絵 -->
<style>
.f01 .bub,.f01 .head,.f01 .eye,.f01 .caret{transform-box:fill-box}
.f01 .bub{transform-origin:0% 100%}
.f01 .head{transform-box:view-box;transform-origin:96px 84px}
.f01 .eye{transform-origin:50% 50%}
.is-playing .f01 .bub,.f01.is-playing .bub{animation:f01-bub 4s ease-in-out infinite}
.is-playing .f01 .caret,.f01.is-playing .caret{animation:f01-caret 4s step-end infinite}
.is-playing .f01 .head,.f01.is-playing .head{animation:f01-nod 4s ease-in-out infinite}
.is-playing .f01 .eye,.f01.is-playing .eye{animation:f01-blink 4s linear infinite}
@keyframes f01-bub{0%{transform:scale(0);opacity:0}8%{transform:scale(1.12);opacity:1}13%{transform:scale(1)}78%{transform:scale(1);opacity:1}88%,100%{transform:scale(.6);opacity:0}}
@keyframes f01-caret{0%{opacity:0}14%{opacity:1}26%{opacity:0}38%{opacity:1}50%{opacity:0}62%{opacity:1}78%{opacity:0}}
@keyframes f01-nod{0%,14%{transform:rotate(0)}20%{transform:rotate(4deg)}26%{transform:rotate(0)}58%{transform:rotate(0)}64%{transform:rotate(3deg)}70%,100%{transform:rotate(0)}}
@keyframes f01-blink{0%,44%,50%,100%{transform:scaleY(1)}47%{transform:scaleY(.1)}}
@media (prefers-reduced-motion:reduce){.f01 *{animation:none!important}}
</style>
<g stroke="#1D262E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
  <!-- うしろの薄い面 -->
  <ellipse cx="92" cy="76" rx="70" ry="50" fill="#E3F4F8" stroke="none"/>
  <!-- 腕（体のうしろから出す：肩の所は体に隠れる） -->
  <path d="M70 112C62 100 63 88 70 80" fill="none" stroke-width="11"/>
  <path d="M70 112C62 100 63 88 70 80" fill="none" stroke="#0093E9" stroke-width="6"/>
  <path d="M122 112C123 100 115 92 106 89" fill="none" stroke-width="11"/>
  <path d="M122 112C123 100 115 92 106 89" fill="none" stroke="#0093E9" stroke-width="6"/>
  <!-- 体（シャツ） -->
  <path d="M58 131C58 107 67 95 84 93H108C125 95 134 107 134 131Z" fill="#0093E9"/>
  <path d="M88 93L96 102L104 93" fill="#fff"/>
  <!-- 首 -->
  <path d="M90 81V94H102V81" fill="#fff"/>
  <!-- 頭（うなずく） -->
  <g class="head">
    <circle cx="96" cy="65" r="19" fill="#fff"/>
    <path d="M77 65C75 48 88 41 99 43C111 44 117 54 115 65C109 57 98 55 89 58C84 59 80 61 77 65Z" fill="#1D262E"/>
    <ellipse class="eye" cx="91" cy="67.5" rx="1.9" ry="2.3" fill="#1D262E" stroke="none"/>
    <ellipse class="eye" cx="103" cy="67.5" rx="1.9" ry="2.3" fill="#1D262E" stroke="none"/>
    <path d="M94 76Q97 77.5 100 76" fill="none" stroke-width="2"/>
    <!-- 電話（左の耳） -->
    <rect x="71" y="57" width="9" height="20" rx="3" fill="#1D262E" transform="rotate(-12 75 67)"/>
    <rect x="73.3" y="60" width="4.4" height="12" rx="1.5" fill="#6FD6E6" stroke="none" transform="rotate(-12 75 67)"/>
  </g>
  <!-- 手（電話を持つ手・あごに当てた手） -->
  <circle cx="71" cy="78" r="5.5" fill="#fff"/>
  <path d="M100 92C99 88 101 85 104 84.5C107 84 109 86 109 89C109 91.5 107 93 104.5 93C102.5 93 100.8 93 100 92Z" fill="#fff"/>
  <!-- 吹き出し（# とカーソル）。ぽんと出る → カーソルが点滅 → 消える -->
  <g class="bub">
    <path d="M131 16H164A15 15 0 0 1 164 46H134L121 55L124.5 43.6A15 15 0 0 1 131 16Z" fill="#1D262E"/>
    <g stroke="#fff" stroke-width="2.4">
      <line x1="137" y1="23" x2="135" y2="39"/><line x1="143" y1="23" x2="141" y2="39"/>
      <line x1="131.5" y1="28" x2="147" y2="28"/><line x1="130.5" y1="34" x2="146" y2="34"/>
    </g>
    <rect class="caret" x="153" y="23" width="2.6" height="16" rx="1.2" fill="#6FD6E6" stroke="none"/>
  </g>
  <!-- 小さな印（水色の点） -->
  <circle cx="186" cy="20" r="2.4" fill="#6FD6E6" stroke="none"/>
  <circle cx="110" cy="22" r="1.8" fill="#6FD6E6" stroke="none"/>
</g>
</svg>
